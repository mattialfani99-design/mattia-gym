/* Anteprima PC v1.1 — registrazione serie e recuperi guidati */
.subtle-tip{border-color:#34465a;background:#101b2c;margin:10px 0 18px}

.rest-settings-title strong{font-size:23px;color:var(--lime);font-variant-numeric:tabular-nums}
.rest-settings .tiny{display:block;line-height:1.55;margin:6px 0 12px}

.rest-settings-actions .mini-btn{min-height:40px;padding:8px 11px;font-size:12px}

.previous-result strong{font-size:13px}

.set-card-title strong{font-size:12px;letter-spacing:.8px}
.set-card-title span{color:#9eb0c2;font-size:10px;font-weight:750;letter-spacing:.1px}
.set-card.is-complete .set-card-title span{color:#c7f8b6}
.set-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(115px,1.2fr);gap:9px;align-items:end}

.set-field span{font-size:10px;letter-spacing:.3px;color:#96a9bc;font-weight:750;white-space:normal}
.set-field .set-input{font-size:17px;height:48px;padding:8px;box-sizing:border-box}
.finish-set-btn{border-radius:10px;border:1px solid #a7f37c;background:var(--lime);color:#193016;font-size:13px;line-height:1.2;font-weight:900;min-height:48px;padding:7px 10px;cursor:pointer}
.finish-set-btn small{font-size:9px;font-weight:750;opacity:.75}

.metric-switch{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.metric-switch .pill{font-size:11px;padding:10px}
.timer-box{position:fixed;z-index:170;bottom:calc(88px + env(safe-area-inset-bottom, 0px));top:auto;right:max(12px,calc((100vw - 625px)/2));width:min(365px,calc(100vw - 24px));display:block;text-align:left;border:1px solid #b4fa89;background:linear-gradient(135deg,#273b29,#192e25);color:#f1ffe9;box-shadow:0 15px 55px #000b;border-radius:18px;padding:15px 17px;font-variant-numeric:tabular-nums}
.timer-top{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:1.3px;font-weight:900;color:#c7f5af}
.timer-close{width:30px;height:30px;border-radius:9px!important;background:#3a5340!important;color:#f2ffe9!important;font-weight:800!important}
.timer-name{font-size:12px;font-weight:650;color:#d1e9d1;margin:1px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-countdown{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:40px;font-weight:950;letter-spacing:-1.5px;line-height:1.05}
.timer-countdown small{font-size:10px;letter-spacing:0;color:#c5dac5;line-height:1.25;text-align:right;font-weight:700;max-width:100px}

.timer-actions button{border:1px solid #5d7e63;background:#2d4a33;color:#e6fce1;border-radius:9px;min-height:36px;padding:6px 3px;font-size:11px;font-weight:850}
.timer-actions button.timer-pause{background:#c3ff75;color:#19331b;border-color:#c3ff75}

<script>
(()=>{'use strict';
const PROGRAM=window.GYM_PROGRAM;
const $=s=>document.querySelector(s);
const app=$('#app');
const DEFAULT={version:2,selectedDay:1,selectedWeek:1,activeId:null,sessions:[],bodyWeights:[],restOverrides:{},timer:null};
let state=structuredClone(DEFAULT),page='home',openExercise=null,chartExercise='d1-chest',chartMetric='max',viewHistoryId=null,timerDeadline=0,timerHandle=null,toastHandle=null,dbPromise;
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nfmt=n=>Number.isFinite(Number(n))?Number(n).toLocaleString('it-IT',{maximumFractionDigits:1}):'—';
const fmtDate=s=>new Date(s).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
const fmtDay=s=>new Date(s).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
const dtIso=()=>new Date().toISOString();
const exList=()=>PROGRAM.days.flatMap(d=>d.exercises);
const findEx=id=>exList().find(e=>e.id===id);
const dayById=id=>PROGRAM.days.find(d=>d.id===Number(id))||PROGRAM.days[0];
const sessionById=id=>state.sessions.find(s=>s.id===id);
const currentSession=()=>sessionById(state.activeId);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const clock=seconds=>{const n=Math.max(0,Math.ceil(seconds)||0);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};
const effectiveRest=ex=>Object.prototype.hasOwnProperty.call(state.restOverrides||{},ex.id)?clamp(Number(state.restOverrides[ex.id])||0,0,900):ex.rest;
function previousSessionForEx(exId,current){return state.sessions.filter(s=>s.id!==current?.id&&s.finishedAt&&s.sets?.[exId]?.some(v=>v.done)).sort((a,b)=>b.startedAt.localeCompare(a.startedAt))[0]||null;}

function openDB(){if(!('indexedDB' in window))return Promise.resolve(null);if(!dbPromise)dbPromise=new Promise(resolve=>{try{let r=indexedDB.open('mattia-gym-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)}catch(e){resolve(null)}});return dbPromise}
async function dbRead(){const db=await openDB();if(!db)return null;return new Promise(resolve=>{try{let t=db.transaction('data','readonly'),r=t.objectStore('data').get('appState');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null)}catch(e){resolve(null)}})}
let saveQueue=Promise.resolve();function persist(){const snapshot=JSON.stringify(state);try{localStorage.setItem('mattia_gym_backup_v1',snapshot)}catch(e){}saveQueue=saveQueue.then(async()=>{const db=await openDB();if(!db)return;await new Promise(resolve=>{try{const t=db.transaction('data','readwrite');t.objectStore('data').put(JSON.parse(snapshot),'appState');t.oncomplete=resolve;t.onerror=resolve}catch(e){resolve()}})});}
async function load(){let backup=null;try{backup=JSON.parse(localStorage.getItem('mattia_gym_backup_v1')||'null')}catch(e){}let saved=await dbRead();if(saved&&Array.isArray(saved.sessions))state={...structuredClone(DEFAULT),...saved};else if(backup&&Array.isArray(backup.sessions))state={...structuredClone(DEFAULT),...backup};state.selectedDay=clamp(Number(state.selectedDay)||1,1,4);state.selectedWeek=clamp(Number(state.selectedWeek)||1,1,6);if(!Array.isArray(state.bodyWeights))state.bodyWeights=[];if(!state.restOverrides||typeof state.restOverrides!=='object')state.restOverrides={};if(!sessionById(state.activeId))state.activeId=null;restoreTimer();render();}
function nav(p){page=p;openExercise=null;viewHistoryId=null;
 if(p==='train'){const session=currentSession();if(session){const day=dayById(session.day);openExercise=day.exercises.find(ex=>(session.sets[ex.id]||[]).some(v=>!v.done))?.id||day.exercises[0]?.id||null;}}
 render();window.scrollTo({top:0,behavior:'instant'})}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.remove('show'),2800)}
const weekControls=()=>`<div class="section-head"><h2>Settimana del programma</h2><small>${state.selectedWeek} di 6</small></div><div class="pill-row">${Array.from({length:6},(_,i)=>`<button class="pill week-pill ${state.selectedWeek===i+1?'active':''}" data-week="${i+1}">S${i+1}</button>`).join('')}</div>`;
const dayControls=()=>`<div class="section-head"><h2>Giorno di allenamento</h2></div><div class="pill-row">${PROGRAM.days.map(d=>`<button class="pill ${state.selectedDay===d.id?'active':''}" data-day="${d.id}">Giorno ${d.id}</button>`).join('')}</div>`;
function completedCount(sess){if(!sess)return 0;return Object.values(sess.sets||{}).reduce((a,arr)=>a+arr.filter(x=>x.done).length,0)}
function sessionTotal(sess){if(!sess)return 0;const d=dayById(sess.day);return d.exercises.reduce((sum,x)=>sum+Number(x.sets[sess.week-1]||0),0)}
function summarySession(sess){const day=dayById(sess.day);return `<div class="history-card card"><div class="list-meta"><span class="eyebrow">${day.label} · sett. ${sess.week}</span><span class="date">${fmtDate(sess.startedAt)}</span></div><h3>${escapeHtml(day.name)}</h3><div class="helper">${completedCount(sess)} / ${sessionTotal(sess)} serie completate${sess.finishedAt?' · terminato':' · in corso'}</div><div class="stat-bar"><span style="width:${sessionTotal(sess)?completedCount(sess)/sessionTotal(sess)*100:0}%"></span></div></div>`}
function renderHome(){const day=dayById(state.selectedDay),last=state.sessions.filter(s=>s.finishedAt).sort((a,b)=>b.finishedAt.localeCompare(a.finishedAt))[0],active=currentSession(),startLabel=active?'Continua la sessione':'Inizia allenamento';const completed=state.sessions.filter(s=>s.finishedAt);const last7=completed.filter(s=>Date.now()-new Date(s.finishedAt).getTime()<7*86400000).length;
return `<div class="eyebrow">IL TUO DIARIO · 100% OFFLINE</div><h1 class="page-title">Il tuo prossimo<br>allenamento<span style="color:var(--lime)">.</span></h1><p class="subtitle">La tua scheda, i tuoi carichi e tutti i progressi. Tutto resta sul dispositivo.</p><div class="hero"><div class="hero-label">${escapeHtml(PROGRAM.name.toUpperCase())} · SETT. ${state.selectedWeek}/6</div><h2>${active?escapeHtml(dayById(active.day).name):escapeHtml(day.name)}</h2><p>${active?'Hai una sessione già iniziata: riprendi da dove eri rimasto.':`${day.exercises.length} esercizi · ${day.warmup} min riscaldamento · ${day.groups.join(' / ')}`}</p><div class="hero-foot"><button class="primary-btn" data-action="${active?'goto-active':'start'}">${startLabel} <span>→</span></button></div></div>
<div class="kpi-grid"><div class="kpi"><strong class="accent">${completed.length}</strong><span>Allenamenti registrati</span></div><div class="kpi"><strong>${last7}</strong><span>Ultimi 7 giorni</span></div><div class="kpi"><strong>${PROGRAM.days.length}</strong><span>Giornate scheda</span></div></div>
${weekControls()}${dayControls()}<div class="section-head"><h2>${day.label} · ${escapeHtml(day.name)}</h2><small>${day.exercises.length} esercizi</small></div><div class="routine-list">${day.exercises.map((e,i)=>`<div class="routine-row"><div class="routine-main"><span class="ordinal">${String(i+1).padStart(2,'0')}</span><div class="routine-text"><strong>${escapeHtml(e.name)}</strong><span>${e.sets[state.selectedWeek-1]===0?'Non previsto':`${e.sets[state.selectedWeek-1]} serie × ${e.reps[state.selectedWeek-1]} ${e.type==='minutes'?'min':e.type==='seconds'?'sec':'rip.'}`}${e.combo?' · SUPERSET':''}</span></div></div><span class="chevron">›</span></div>`).join('')}</div>
${last?`<div class="section-head"><h2>Ultimo allenamento</h2></div>${summarySession(last)}`:''}<div class="hint">↗ Per registrare pesi e ripetizioni, tocca <strong>Inizia allenamento</strong>. Nessun dato è stato inventato: i carichi appariranno solo dopo averli inseriti.</div>`}
function createSession(day,week){const d=dayById(day);const sets={};for(const ex of d.exercises){const count=ex.sets[week-1];sets[ex.id]=Array.from({length:count},()=>({kg:'',reps:ex.reps[week-1]==='MAX'?'':String(ex.reps[week-1]),done:false}));}return {id:'s'+Date.now()+Math.random().toString(36).slice(2,7),day,week,startedAt:dtIso(),finishedAt:null,sets,notes:''}}
function startSession(){if(state.activeId){const old=currentSession();if(old.day===state.selectedDay&&old.week===state.selectedWeek){nav('train');return}if(!confirm('Hai già una sessione in corso. Vuoi crearne una nuova? La precedente resterà salvata nello storico.'))return;state.activeId=null;}const session=createSession(state.selectedDay,state.selectedWeek);state.sessions.push(session);state.activeId=session.id;persist();nav('train');toast('Allenamento iniziato!')}
function renderTrain(){const s=currentSession(),day=dayById(s?s.day:state.selectedDay),week=s?s.week:state.selectedWeek;
return `<div class="eyebrow">ALLENAMENTO · ${PROGRAM.name.toUpperCase()}</div><div class="intro-row"><h1 class="page-title" style="margin-bottom:4px">${day.label}<span style="color:var(--lime)">.</span></h1><span class="tag special">SETT. ${week}/6</span></div><p class="subtitle">${escapeHtml(day.name)} · ${day.exercises.length} esercizi${day.warmup?' · '+day.warmup+' min riscaldamento':''}</p>${s?`<div class="session-banner"><span>● Sessione in corso · ${completedCount(s)}/${sessionTotal(s)} serie</span><span>✓ Salvataggio automatico</span></div><div class="hint subtle-tip">Inserisci i kg e le ripetizioni, poi premi <strong>Fine serie</strong>: parte il recupero previsto dalla scheda. Puoi regolarlo dentro ogni esercizio.</div>`:`<div class="hint">Scegli giorno e settimana dalla Home, poi inizia una sessione per registrare i risultati.</div><div class="session-actions"><button class="primary-btn" data-action="start">Inizia ${day.label}</button><button class="secondary-btn" data-nav="home">Cambia giorno</button></div>`}
${day.exercises.map((ex,i)=>renderExercise(ex,i,week,s)).join('')}${s?`<div class="session-actions"><button class="primary-btn" data-action="finish">✓ Termina allenamento</button><button class="secondary-btn" data-action="abandon">Salva ed esci</button></div><p class="helper">Puoi uscire e rientrare quando vuoi. L'allenamento rimane salvato in memoria.</p>`:''}`}
function renderExercise(ex,i,week,s){
 const count=ex.sets[week-1],reps=ex.reps[week-1],open=openExercise===ex.id;
 const arr=s?.sets?.[ex.id]||[],done=arr.filter(x=>x.done).length;
 const rest=effectiveRest(ex),isTime=ex.type==='minutes'||ex.type==='seconds';
 const previous=s?previousSessionForEx(ex.id,s):null;
 const lastRows=previous?.sets?.[ex.id]?.filter(x=>x.done)||[];
 const lastBest=lastRows.filter(x=>x.kg!==''&&Number.isFinite(Number(x.kg))).reduce((m,x)=>Math.max(m,Number(x.kg)),0);
 let log='';
 if(count&&s){
  log=`${previous&&ex.type==='strength'?`<div class="previous-result"><div><span class="label-small">ULTIMO ALLENAMENTO · ${fmtDate(previous.startedAt)}</span><strong>${nfmt(lastBest)} kg · ${lastRows.length} serie registrate</strong></div><button type="button" class="mini-btn" data-action="copy-previous" data-exid="${ex.id}">↘ Riusa i carichi</button></div>`:''}
   <div class="set-group">${arr.map((v,k)=>{
    const last=lastRows[k];
    return `<div class="set-card ${v.done?'is-complete':''}">
      <div class="set-card-title"><strong>SERIE ${String(k+1).padStart(2,'0')}</strong><span>${v.done?'✓ CONCLUSA':`OBIETTIVO: ${escapeHtml(reps)} ${ex.type==='minutes'?'MIN':ex.type==='seconds'?'SEC':'RIP'}`}</span></div>
      <div class="set-fields">
       <label class="set-field"><span>${isTime?'CARICO (OPZ.)':'CARICO · KG'}</span><input class="set-input" type="number" inputmode="decimal" min="0" max="1000" step="0.5" aria-label="Carico in kg serie ${k+1} di ${escapeHtml(ex.name)}" placeholder="${last&&last.kg!==''?'Prec. '+escapeHtml(last.kg):'0.0'}" data-set-field="kg" data-ex="${ex.id}" data-idx="${k}" value="${escapeHtml(v.kg)}"></label>
       <label class="set-field"><span>${ex.type==='minutes'?'MINUTI':ex.type==='seconds'?'SECONDI':'RIPETIZIONI'}</span><input class="set-input" type="number" inputmode="numeric" min="0" max="1000" step="1" aria-label="Ripetizioni o durata serie ${k+1}" placeholder="${escapeHtml(reps)}" data-set-field="reps" data-ex="${ex.id}" data-idx="${k}" value="${escapeHtml(v.reps)}"></label>
       <button type="button" class="finish-set-btn ${v.done?'finished':''}" data-check="${ex.id}" data-idx="${k}">${v.done?'✓ Completata<br><small>Tocca per annullare</small>':'✓ Fine serie<br><small>'+(rest?`Avvia ${clock(rest)} recupero`:'Senza recupero')+'</small>'}</button>
      </div>
     </div>`;
   }).join('')}</div>
   <div class="exercise-foot"><span class="tiny">${done} di ${count} serie concluse · salvate automaticamente</span>${done===count?'<span class="badge-complete">ESERCIZIO COMPLETATO</span>':''}</div>`;

function sessionsForEx(exId){
 const ex=findEx(exId);
 return state.sessions.filter(s=>s.sets?.[exId]?.some(x=>x.done)).sort((a,b)=>a.startedAt.localeCompare(b.startedAt)).map(s=>{

  const weights=done.filter(x=>x.kg!==''&&Number.isFinite(Number(x.kg))).map(x=>Number(x.kg));
  const quantities=done.filter(x=>x.reps!==''&&Number.isFinite(Number(x.reps))).map(x=>Number(x.reps));
  const max=ex.type==='strength'&&weights.length?Math.max(...weights):(ex.type!=='strength'&&quantities.length?Math.max(...quantities):null);
  const volume=ex.type==='strength'?done.reduce((tot,x)=>tot+((x.kg!==''&&x.reps!=='')?Number(x.kg)*Number(x.reps):0),0):null;

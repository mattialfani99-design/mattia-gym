/* Anteprima PC v1.1 — registrazione serie e recuperi guidati */
.subtle-tip{border-color:#34465a;background:#101b2c;margin:10px 0 18px}

.set-card.is-complete .set-card-title span{color:#c7f8b6}
.set-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(115px,1.2fr);gap:9px;align-items:end}

function sessionsForEx(exId){
 const ex=findEx(exId);
 return state.sessions.filter(s=>s.sets?.[exId]?.some(x=>x.done)).sort((a,b)=>a.startedAt.localeCompare(b.startedAt)).map(s=>{
  const done=s.sets[exId].filter(x=>x.done);
  const weights=done.filter(x=>x.kg!==''&&Number.isFinite(Number(x.kg))).map(x=>Number(x.kg));
  const quantities=done.filter(x=>x.reps!==''&&Number.isFinite(Number(x.reps))).map(x=>Number(x.reps));
  const max=ex.type==='strength'&&weights.length?Math.max(...weights):(ex.type!=='strength'&&quantities.length?Math.max(...quantities):null);
  const volume=ex.type==='strength'?done.reduce((tot,x)=>tot+((x.kg!==''&&x.reps!=='')?Number(x.kg)*Number(x.reps):0),0):null;
  const reps=quantities.reduce((a,b)=>a+b,0);
  return {s,max,volume,reps,kind:ex.type==='minutes'?'min':ex.type==='seconds'?'sec':'kg',done:done.length};
 });
}

const PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfJsLoading;
function loadPdfLibrary(){
 if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
 if(pdfJsLoading)return pdfJsLoading;
 pdfJsLoading=new Promise((resolve,reject)=>{
  const tag=document.createElement('script'); tag.src=PDFJS_URL;tag.crossOrigin='anonymous';
  tag.onload=()=>window.pdfjsLib?resolve(window.pdfjsLib):reject(new Error('Libreria PDF non disponibile'));
  tag.onerror=()=>reject(new Error('Per il primo utilizzo serve Internet per caricare PDF.js. Nessun documento viene inviato online.'));
  document.head.appendChild(tag);
 }).catch(err=>{pdfJsLoading=null;throw err});
 return pdfJsLoading;
}

function pdfLines(items,pageHeight){
 const words=items.filter(t=>t.str&&t.str.trim()).map(t=>({text:t.str.trim(),x:t.transform[4],y:pageHeight-t.transform[5]})).sort((a,b)=>a.y-b.y||a.x-b.x);
 const lines=[];
 for(const w of words){let line=lines[lines.length-1];if(!line||Math.abs(line.y-w.y)>2.8){line={y:w.y,words:[]};lines.push(line)}line.words.push(w)}
 return lines.map(l=>({...l,words:l.words.sort((a,b)=>a.x-b.x),text:l.words.map(x=>x.text).join(' ').replace(/\s+/g,' ').trim()}));
}
function parseWorkoutPdf(pages,filename){
 const days=[];let active=null;let maxWeeks=0;const warnings=[];
 for(const pageLines of pages){
  for(let i=0;i<pageLines.length;i++){
   const line=pageLines[i],txt=line.text;
   const dayMatch=txt.match(/\bGiorno\s+(\d+)\b/i);
   if(dayMatch&&line.words.some(w=>w.x<115)){
    const num=Number(dayMatch[1]);active=days.find(d=>d.originalDay===num);
    if(!active){active={originalDay:num,label:'Giorno '+num,name:'Allenamento '+num,warmup:10,groups:[],exercises:[]};days.push(active)}
    const warm=txt.match(/RISCALDAMENTO\s*:\s*(\d+)/i);if(warm)active.warmup=Number(warm[1]);
    continue;
   }
   if(!active)continue;
   const header=txt.match(/^(?:Singolo|Combo\s*\(\s*[12]\s+di\s+2\s*\))\s+(.+)$/i);
   if(!header)continue;
   const exName=header[1].trim();if(!exName||exName.length>140)continue;
   const ex={id:'pdf-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9),name:exName,sets:[],reps:[],rest:90,tempo:'',type:/CARDIO|TAPIS ROULANT/i.test(exName)?'minutes':/PLANK/i.test(exName)?'seconds':'strength',video:'',note:''};
   let weekLabels=[],notes=[],dataFound=false;
   const nextHeaderIndex=pageLines.findIndex((l,j)=>j>i&&(/^(?:Singolo|Combo\s*\(\s*[12]\s+di\s+2\s*\))\s+/i.test(l.text)||/\bGiorno\s+\d+\b/i.test(l.text)&&l.words.some(w=>w.x<115)));
   const end=nextHeaderIndex>=0?nextHeaderIndex:pageLines.length;
   for(let k=i+1;k<end;k++){
    const l=pageLines[k],t=l.text;
    if(/^Note esercizio\s*:/i.test(t)){notes.push(t.replace(/^Note esercizio\s*:\s*/i,''));continue}
    if(/^Video\s*:/i.test(t)){const m=t.match(/https?:\/\/\S+/i);if(m)ex.video=m[0].replace(/[),.;]+$/,'');continue}
    if(notes.length&&l.y-pageLines[k-1].y<16&&!/SETT\.|SED\.|\bTUT\b|\(SEC\)|\bPREP\b/i.test(t)&&!dataFound&&!weekLabels.length&&l.words[0]?.x<60){notes.push(t);continue}
    const markers=l.words.filter(w=>/SETT\.?\s*\d+/i.test(w.text));
    if(markers.length>=2){weekLabels=markers.map(w=>({x:w.x,n:Number(w.text.match(/\d+/)[0])})).sort((a,b)=>a.x-b.x);continue}
    if(!weekLabels.length){const count=(t.match(/SETT\.?\s*\d+/gi)||[]).length;
     if(count>=2){const n=Math.min(12,count);weekLabels=Array.from({length:n},(_,ix)=>({x:35+ix*83,n:ix+1}));continue}}
    if(dataFound||!weekLabels.length)continue;
    // Identify the target row using x-aligned cells (SETT columns).
    const cells=weekLabels.map((p,idx)=>{
     const right=idx+1<weekLabels.length?(p.x+weekLabels[idx+1].x)/2:p.x+40;
     const left=idx? (weekLabels[idx-1].x+p.x)/2:p.x-25;
     return l.words.filter(w=>w.x>=left&&w.x<right).map(w=>w.text).join(' ');
    });
    const parsed=cells.map(s=>s.match(/(\d+)\s*[x×]\s*(MAX|\d+)/i));
    if(parsed.filter(Boolean).length<Math.min(3,weekLabels.length))continue;
    ex.sets=parsed.map(m=>m?Number(m[1]):0);ex.reps=parsed.map(m=>m?(m[2].toUpperCase()==='MAX'?'MAX':Number(m[2])):0);dataFound=true;
    const restItems=l.words.filter(w=>w.x>(weekLabels[weekLabels.length-1].x+65));
    const ints=restItems.filter(w=>/^\d+$/.test(w.text));
    const possible=ints.find(w=>w.x>540&&w.x<575);
    if(possible)ex.rest=Number(possible.text);
    // Tempo value is often in a cell before the RIP seconds value.
    const tempo=t.match(/\b\d\s*[-–]\s*\d\s*[-–]\s*\d\s*[-–]\s*\d\b/);if(tempo)ex.tempo=tempo[0];
   }
   if(dataFound){
    ex.note=notes.join(' ').trim();
    maxWeeks=Math.max(maxWeeks,ex.sets.length);active.exercises.push(ex);
   }else warnings.push('Dati non riconosciuti per '+exName);
   i=end-1;
  }
 }
 const kept=days.filter(d=>d.exercises.length);
 if(!kept.length)throw Error('Non ho riconosciuto esercizi e tabelle. Serve un PDF con testo selezionabile e struttura simile a quello del preparatore.');
 const weeks=Math.max(1,Math.min(6,maxWeeks));
 for(const day of kept)for(const ex of day.exercises){for(let w=0;w<6;w++){if(ex.sets[w]===undefined)ex.sets[w]=0;if(ex.reps[w]===undefined)ex.reps[w]=0}ex.sets=ex.sets.slice(0,6);ex.reps=ex.reps.slice(0,6)}
 return {name:filename.replace(/\.pdf$/i,'').replace(/[_-]/g,' ').trim()||'Nuova scheda',athlete:PROGRAM.athlete||'Mattia',weeks,days:kept,warnings};
}
async function readWorkoutPdf(file){
 if(!file||!(/\.pdf$/i.test(file.name)||file.type==='application/pdf'))throw Error('Seleziona un PDF valido.');
 if(file.size>15*1024*1024)throw Error('Il PDF supera i 15 MB.');
 const library=await loadPdfLibrary();
 // Serve a same-origin Blob worker: dopo la prima lettura la copia CDN può essere recuperata dalla cache della PWA.
 if(!window.__mattiaPdfWorkerUrl){
  try{const response=await fetch(PDFJS_WORKER,{mode:'cors'});if(!response.ok)throw Error('PDF worker unavailable');
   const workerCode=await response.text();window.__mattiaPdfWorkerUrl=URL.createObjectURL(new Blob([workerCode],{type:'text/javascript'}));
  }catch(err){throw Error('Serve Internet almeno una volta per preparare il lettore PDF offline. Riprova con la connessione attiva.');}
 }
 library.GlobalWorkerOptions.workerSrc=window.__mattiaPdfWorkerUrl;
 const data=new Uint8Array(await file.arrayBuffer());
 const task=library.getDocument({data,disableFontFace:true,useSystemFonts:true});
 let doc;try{doc=await task.promise;const all=[];for(let n=1;n<=doc.numPages;n++){
  const page=await doc.getPage(n);const content=await page.getTextContent();
  all.push(pdfLines(content.items,page.getViewport({scale:1}).height));
 }return parseWorkoutPdf(all,file.name)
 }finally{if(doc)await doc.destroy().catch(()=>{})}
}
async function importPdfFile(file){pdfLoading=true;pdfCandidate=null;pdfStatus='Lettura del PDF in corso…';render();try{
 pdfCandidate=await readWorkoutPdf(file);const count=pdfCandidate.days.reduce((n,d)=>n+d.exercises.length,0);
 pdfStatus=`Trovati ${pdfCandidate.days.length} giorni, ${pdfCandidate.weeks} settimane e ${count} esercizi. Verifica tutti i valori e conferma solo se corretti.`;
 }catch(err){pdfStatus='Importazione non riuscita: '+(err?.message||String(err))}finally{pdfLoading=false;render()}}
function applyPdfProgram(){

  for(let ei=0;ei<d.exercises.length;ei++){
   const ex=d.exercises[ei];ex.name=document.querySelector(`[data-pdf-name="${di}:${ei}"]`)?.value.trim()||'';
   if(!ex.name){toast('Controlla i nomi degli esercizi');return}
   for(let wi=0;wi<6;wi++){
    const num=Number(document.querySelector(`[data-pdf-sets="${di}:${ei}:${wi}"]`)?.value);
    const txt=document.querySelector(`[data-pdf-reps="${di}:${ei}:${wi}"]`)?.value.trim()||'';
    if(!Number.isInteger(num)||num<0||num>30||!txt){toast('Controlla serie e ripetizioni della scheda importata');return}
    ex.sets[wi]=num;ex.reps[wi]=/^\d+$/.test(txt)?Number(txt):txt.toUpperCase();
   }
   const rest=Number(document.querySelector(`[data-pdf-rest="${di}:${ei}"]`)?.value);
   if(!Number.isFinite(rest)||rest<0||rest>900){toast('Controlla i recuperi');return}ex.rest=rest;
  }
 }
 if(!confirm('Sostituire la scheda attuale con quella importata? Lo storico precedente rimarrà salvato. Si consiglia prima un backup JSON.'))return;
 PROGRAM={name:copy.name,athlete:copy.athlete,weeks:6,days:copy.days};
 state.selectedDay=1;state.selectedWeek=1;editDayId=1;editExId=null;pdfCandidate=null;pdfStatus='Nuova scheda importata correttamente.';persist();render();toast('Scheda PDF importata ✓');
}
function renderSettings(){const recent=state.bodyWeights.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="eyebrow">PERSONALIZZA & PROTEGGI</div><h1 class="page-title">Impostazioni<span style="color:var(--lime)">.</span></h1><p class="subtitle">Modifica liberamente giorni, esercizi, serie e recuperi. Gestisci anche il peso corporeo e i backup. Nessun account e nessun invio di dati.</p>${renderPdfImporter()}${renderProgramEditor()}<div class="section-head"><h2>Peso corporeo</h2></div><div class="card"><p class="helper" style="margin-top:0">Registra il peso quando vuoi, anche in giorni senza allenamento.</p><div class="form-row"><input type="date" id="weight-date" class="field" value="${new Date().toLocaleDateString('en-CA')}"><input id="weight-value" class="field" type="number" min="1" step="0.1" inputmode="decimal" placeholder="kg"></div><button class="primary-btn" style="width:100%;margin-top:11px" data-action="save-weight">+ Registra peso</button>${recent.length?`<div class="line"></div>${recent.slice(0,7).map(x=>`<div class="list-meta" style="font-size:12px;margin-bottom:10px"><span class="muted">${escapeHtml(x.date)}</span><strong>${nfmt(x.kg)} kg</strong></div>`).join('')}`:''}</div><div class="section-head"><h2>Backup dei dati</h2></div><div class="card"><p class="helper" style="margin-top:0">I dati sono nella memoria locale del browser su questo dispositivo. Esporta spesso il backup nell'app File: se elimini i dati del sito potresti perdere lo storico.</p><div class="session-actions"><button class="primary-btn" data-action="export">↓ Esporta JSON</button><label class="secondary-btn file-picker" for="import-file">↑ Importa JSON<input id="import-file" type="file" accept=".json,application/json"></label></div><div class="hint">Il file JSON contiene anche la scheda personalizzata, le note, le serie, i carichi e il peso corporeo. Conservalo in un luogo sicuro.</div></div><div class="section-head"><h2>Informazioni</h2></div><div class="card"><div class="list-meta"><span class="helper">Scheda</span><strong>${PROGRAM.name}</strong></div><div class="line"></div><div class="list-meta"><span class="helper">Giornate / settimane</span><strong>${PROGRAM.days.length} / 6</strong></div><div class="line"></div><div class="list-meta"><span class="helper">Allenamenti in memoria</span><strong>${state.sessions.length}</strong></div><div class="line"></div><div class="list-meta"><span class="helper">Archiviazione</span><strong>IndexedDB + localStorage</strong></div></div><p class="helper">La versione HTML si apre sul PC senza Internet; i video esterni richiedono connessione. Per aggiornare l’app iPhone sarà necessario pubblicare la versione PWA aggiornata.</p></div>`}
function render(){const sections={home:renderHome,train:renderTrain,progress:renderProgress,history:renderHistory,settings:renderSettings};app.innerHTML=(sections[page]||renderHome)();document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.toggle('active',b.dataset.nav===page);b.setAttribute('aria-current',b.dataset.nav===page?'page':'false')});}
function toggleDone(exId,idx){
 const s=currentSession();if(!s||!s.sets?.[exId]?.[idx])return;
 const ex=historyDay(s).exercises.find(e=>e.id===exId)||findEx(exId),row=s.sets[exId][idx];
 if(row.done){row.done=false;row.completedAt=null;persist();render();toast('Serie riaperta per modifica');return;}
 const reps=Number(row.reps),kg=Number(row.kg);
 if(row.reps===''||!Number.isFinite(reps)||reps<=0||reps>1000){toast('Inserisci le ripetizioni (o la durata) prima di terminare.');const input=document.querySelector(`[data-set-field="reps"][data-ex="${exId}"][data-idx="${idx}"]`);input?.focus();return;}
 if(ex.type==='strength'&&(row.kg===''||!Number.isFinite(kg)||kg<0||kg>1000)){toast('Inserisci il carico in kg (0 se è a corpo libero).');const input=document.querySelector(`[data-set-field="kg"][data-ex="${exId}"][data-idx="${idx}"]`);input?.focus();return;}
 row.done=true;row.completedAt=dtIso();persist();
 const remaining=s.sets[exId].some(x=>!x.done);
 const rest=effectiveRest(ex);
 if(remaining&&rest>0){startTimer(rest,ex.name,ex.id);toast('Serie salvata ✓ · recupero avviato');}
 else if(remaining){stopTimer();toast('Serie salvata ✓ · senza pausa');}
 else{if(state.timer?.exId===exId)stopTimer();toast('Esercizio completato ✓');}
 render();
}
function restoreTimer(){
 const t=state.timer;
 if(!t)return;
 if(!t.paused&&t.deadline>Date.now()){timerDeadline=t.deadline;clearInterval(timerHandle);timerHandle=setInterval(drawTimer,350);drawTimer()}
 else if(t.paused){timerDeadline=0;clearInterval(timerHandle);drawTimer()}
 else{state.timer=null;timerDeadline=0;}
}
function startTimer(seconds,label='Recupero',exId=null){
 seconds=clamp(Math.round(Number(seconds)||0),0,900);if(seconds<=0)return;
 timerDeadline=Date.now()+seconds*1000;
 state.timer={deadline:timerDeadline,duration:seconds,label,exId,paused:false,remaining:seconds};
 persist();clearInterval(timerHandle);drawTimer();timerHandle=setInterval(drawTimer,350);
}
function drawTimer(){
 const box=$('#timer-box'),t=state.timer;
 if(!t){box.classList.add('hidden');clearInterval(timerHandle);return;}
 const left=t.paused?t.remaining:Math.max(0,Math.ceil((t.deadline-Date.now())/1000));
 if(!t.paused&&!left){stopTimer();toast('◷ Recupero finito! Prossima serie.');return;}
 const percentage=clamp(100*(1-left/(t.duration||1)),0,100);
 box.classList.remove('hidden');
 box.innerHTML=`<div class="timer-top"><span>◷ ${t.paused?'RECUPERO IN PAUSA':'RECUPERO IN CORSO'}</span><button type="button" class="timer-close" data-action="stop-timer" title="Chiudi recupero">✕</button></div>
 <div class="timer-name">${escapeHtml(t.label||'Esercizio')}</div>
 <div class="timer-countdown">${clock(left)}<small>${t.paused?'In pausa':'Prima della prossima serie'}</small></div>
 <div class="timer-progress"><span style="width:${percentage}%"></span></div>
 <div class="timer-actions"><button type="button" data-timer-adjust="-15">−15 s</button><button type="button" class="timer-pause" data-action="pause-timer">${t.paused?'▶ Riprendi':'Ⅱ Pausa'}</button><button type="button" data-timer-adjust="15">+15 s</button><button type="button" data-action="stop-timer">Salta ↗</button></div>`;
}
function pauseTimer(){
 const t=state.timer;if(!t)return;
 if(t.paused){t.deadline=Date.now()+t.remaining*1000;t.paused=false;timerDeadline=t.deadline;}
 else{t.remaining=Math.max(1,Math.ceil((t.deadline-Date.now())/1000));t.paused=true;timerDeadline=0;}
 persist();drawTimer();
}
function adjustTimer(delta){
 const t=state.timer;if(!t)return;
 let left=t.paused?t.remaining:Math.max(0,Math.ceil((t.deadline-Date.now())/1000));
 const next=clamp(left+delta,0,900);
 if(next===0){stopTimer();return;}
 if(t.paused)t.remaining=next;else{t.deadline=Date.now()+next*1000;timerDeadline=t.deadline;}
 t.duration=Math.max(t.duration,next);persist();drawTimer();
}
function stopTimer(){clearInterval(timerHandle);timerHandle=null;timerDeadline=0;state.timer=null;persist();$('#timer-box').classList.add('hidden')}
function changeRest(exId,seconds){const ex=findEx(exId);if(!ex)return;const value=clamp(Math.round(Number(seconds)||0),0,900);state.restOverrides[exId]=value;persist();render();}
function copyPrevious(exId){const s=currentSession(),p=previousSessionForEx(exId,s);if(!s||!p)return;const rows=s.sets[exId]||[],last=p.sets[exId]||[];rows.forEach((row,i)=>{if(!row.done&&row.kg===''&&last[i]?.done)row.kg=last[i].kg});persist();render();toast('Carichi precedenti copiati nei campi vuoti');}

function exportBackup(){const backup={app:'MattiaGym',version:2,exportedAt:dtIso(),data:{...state,program:PROGRAM}};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mattia-gym-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('Backup pronto da salvare in File')}
async function importBackup(file){try{const raw=JSON.parse(await file.text()),newState=raw.data||raw;if(!Array.isArray(newState.sessions)||!Array.isArray(newState.bodyWeights))throw Error('Struttura non valida');if(!confirm('Importare questo backup? Sovrascriverà tutti i dati attualmente presenti.'))return;state={...structuredClone(DEFAULT),...newState};if(state.program?.days?.length)PROGRAM=structuredClone(state.program);state.activeId=sessionById(state.activeId)?state.activeId:null;state.selectedDay=PROGRAM.days.some(d=>d.id===Number(state.selectedDay))?Number(state.selectedDay):PROGRAM.days[0].id;state.selectedWeek=clamp(Number(state.selectedWeek)||1,1,6);persist();render();toast('Backup importato correttamente')}catch(e){toast('Impossibile leggere il backup JSON')}}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-nav],[data-week],[data-day],[data-action],[data-open],[data-check],[data-timer],[data-history],[data-rest-step],[data-rest-reset],[data-metric],[data-timer-adjust],[data-edit-day],[data-edit-ex],[data-move-ex]');if(!t)return;
 if(t.dataset.nav){nav(t.dataset.nav);return}
 if(t.dataset.editDay){editDayId=Number(t.dataset.editDay);editExId=null;render();return}
 if(t.dataset.editEx){editExId=t.dataset.editEx;render();return}
 if(t.dataset.moveEx){const d=PROGRAM.days.find(x=>x.id===editDayId)||PROGRAM.days[0];const i=d.exercises.findIndex(x=>x.id===t.dataset.moveEx),j=i+Number(t.dataset.direction);if(i>=0&&j>=0&&j<d.exercises.length){[d.exercises[i],d.exercises[j]]=[d.exercises[j],d.exercises[i]];persist();render()}return}
 if(t.dataset.week){state.selectedWeek=Number(t.dataset.week);persist();render();return}
 if(t.dataset.day){state.selectedDay=Number(t.dataset.day);persist();render();return}
 if(t.dataset.open){openExercise=openExercise===t.dataset.open?null:t.dataset.open;render();return}
 if(t.dataset.check){toggleDone(t.dataset.check,Number(t.dataset.idx));return}
 if(t.dataset.timer){startTimer(Number(t.dataset.timer));return}
 if(t.dataset.history){viewHistoryId=t.dataset.history;render();return}
 if(t.dataset.restStep){const ex=findEx(t.dataset.exid);if(ex)changeRest(ex.id,effectiveRest(ex)+Number(t.dataset.restStep));return}
 if(t.dataset.restReset){delete state.restOverrides[t.dataset.restReset];persist();render();toast('Recupero ripristinato dalla scheda');return}
 if(t.dataset.metric){chartMetric=t.dataset.metric;render();return}
 if(t.dataset.timerAdjust){adjustTimer(Number(t.dataset.timerAdjust));return}
 switch(t.dataset.action){
 case 'start':startSession();break;
 case 'add-day':addDay();break;
 case 'add-exercise':addExercise();break;
 case 'save-day':saveDay();break;
 case 'save-exercise':saveExercise();break;
 case 'delete-day':{if(PROGRAM.days.length<=1)return;const d=PROGRAM.days.find(x=>x.id===editDayId);if(!confirm('Eliminare '+d.name+' dalla scheda? Gli allenamenti già registrati rimarranno nello storico.'))return;PROGRAM.days=PROGRAM.days.filter(x=>x.id!==d.id);editDayId=PROGRAM.days[0].id;editExId=null;state.selectedDay=editDayId;persist();render();break;}
 case 'delete-exercise':{const d=PROGRAM.days.find(x=>x.id===editDayId)||PROGRAM.days[0],ex=d.exercises.find(x=>x.id===editExId);if(!ex||!confirm('Eliminare '+ex.name+' dalla scheda? Lo storico resterà disponibile.'))return;d.exercises=d.exercises.filter(x=>x.id!==ex.id);editExId=null;persist();render();break;}
 case 'goto-active':nav('train');break;
 case 'stop-timer':stopTimer();break;
 case 'pause-timer':pauseTimer();break;
 case 'copy-previous':copyPrevious(t.dataset.exid);break;
 case 'finish':{
  const s=currentSession();if(!s)return;
  if(!completedCount(s)&&!confirm('Non hai terminato nessuna serie. Vuoi chiudere comunque?'))return;
  s.finishedAt=dtIso();state.activeId=null;persist();stopTimer();nav('history');toast('Allenamento completato ✓');break;
 }
 case 'abandon':nav('home');toast('Allenamento in pausa, puoi riprenderlo dalla Home');break;
 case 'cancel-session':{const s=currentSession();if(!s)return;if(!confirm('Annullare questo allenamento? Tutte le serie di questa sessione saranno eliminate e NON finiranno nello storico.'))return;state.sessions=state.sessions.filter(x=>x.id!==s.id);state.activeId=null;stopTimer();persist();nav('home');toast('Allenamento annullato senza salvare');break;}
 case 'history-back':viewHistoryId=null;render();break;
 case 'reopen':{
  const s=sessionById(t.dataset.sid);if(!s)return;
  if(currentSession()&&state.activeId!==s.id&&!confirm('È presente un’altra sessione in corso. Vuoi passare a questa?'))return;
  s.finishedAt=null;state.activeId=s.id;persist();nav('train');break;
 }
 case 'delete-session':{
  if(!confirm('Eliminare definitivamente questo allenamento?'))return;
  state.sessions=state.sessions.filter(s=>s.id!==t.dataset.sid);
  if(state.activeId===t.dataset.sid)state.activeId=null;
  persist();viewHistoryId=null;render();toast('Allenamento eliminato');break;
 }
 case 'apply-pdf':applyPdfProgram();break;
 case 'discard-pdf':pdfCandidate=null;pdfStatus='Importazione annullata.';render();break;
 case 'export':exportBackup();break;
 case 'save-weight':{
  const date=$('#weight-date')?.value,weight=Number($('#weight-value')?.value);
  if(!date||!Number.isFinite(weight)||weight<20||weight>400){toast('Inserisci una data e un peso valido');return}
  state.bodyWeights=state.bodyWeights.filter(x=>x.date!==date);
  state.bodyWeights.push({date,kg:weight});persist();render();toast('Peso registrato');break;
 }
 }
});

document.addEventListener('input',e=>{const t=e.target;if(!t.dataset.setField&&!t.dataset.setNote)return;const s=currentSession();if(!s||!s.sets[t.dataset.ex])return;const row=s.sets[t.dataset.ex][Number(t.dataset.idx)];if(!row)return;if(t.dataset.setNote){row.note=t.value.slice(0,1200);persist();return}let value=t.value;if(value!==''&&(!Number.isFinite(Number(value))||Number(value)<0))return;row[t.dataset.setField]=value;persist()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='chart-select'){chartExercise=t.value;render()}else if(t.dataset.restInput){changeRest(t.dataset.restInput,Number(t.value))}else if(t.id==='import-file'&&t.files&&t.files[0])importBackup(t.files[0]);else if(t.id==='pdf-import-file'&&t.files&&t.files[0])importPdfFile(t.files[0])});
window.addEventListener('focus',()=>{if(state.timer)drawTimer()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.timer)drawTimer()});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
load();
})();

</script>
